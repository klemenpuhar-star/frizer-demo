<title>Moje naročilo — {IME}</title>

<style>
:root{ --navy:#1c1a19; --coral:#b08d57; --bez:#e8dfd3; --line:#ebe4da; --bg:#fbf8f4; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--navy); font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; line-height:1.5; }
.wrap{ max-width:640px; margin:0 auto; padding:22px 16px 60px; }
.brand{ text-align:center; margin:8px 0 18px; }
.brand img{ height:54px; }
.brand .nm{ font-family:Georgia,'Times New Roman',serif; font-size:1.5rem; letter-spacing:.5px; margin-top:6px; }
.card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 6px 22px rgba(28,26,25,.06); }
h1{ font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:1.5rem; margin:0 0 4px; }
.sub{ color:#7c8a93; font-size:.9rem; margin:0 0 16px; }
.row{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px dashed var(--line); }
.row:last-child{ border-bottom:none; }
.row .k{ color:#7c8a93; font-size:.9rem; }
.row .v{ font-weight:600; text-align:right; }
.badge{ display:inline-block; padding:3px 11px; border-radius:999px; font-size:.78rem; font-weight:600; }
.b-nova{ background:#fdf0d5; color:#9a6b00; }
.b-potrjeno{ background:#dcf3e3; color:#1f7a44; }
.b-opravljeno{ background:#eceff1; color:#5b6b75; }
.b-preklicano{ background:#fbe0e0; color:#b23b3b; }
.b-dogovor{ background:#e7ecf5; color:#3a5a86; }
.note{ border-radius:12px; padding:13px 15px; font-size:.9rem; margin:14px 0 0; }
.note-info{ background:#eef4fb; color:#2f5e92; }
.note-warn{ background:#fdf0d5; color:#8a5a00; }
.note-bad{ background:#fbe0e0; color:#b23b3b; }
.note-ok{ background:#dcf3e3; color:#1f7a44; }
.actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.btn{ border:none; border-radius:12px; padding:13px 18px; font-family:inherit; font-size:.95rem; font-weight:600; cursor:pointer; flex:1; min-width:140px; }
.btn-primary{ background:var(--coral); color:var(--navy); }
.btn-primary:hover{ filter:brightness(.95); }
.btn-ghost{ background:#fff; color:var(--navy); border:1.5px solid var(--line); }
.btn-ghost:hover{ border-color:var(--coral); color:var(--coral); }
.btn-danger{ background:#fff; color:#b23b3b; border:1.5px solid #f1c9c9; }
.btn-danger:hover{ background:#fbe0e0; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.loading{ text-align:center; color:#7c8a93; padding:40px 0; }
.acc{ margin-top:6px; }
.acc details{ border:1px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden; }
.acc summary{ list-style:none; cursor:pointer; padding:12px 14px; font-weight:600; background:#fff; display:flex; justify-content:space-between; }
.acc summary::-webkit-details-marker{ display:none; }
.acc summary .ar{ color:var(--coral); }
.item{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line); }
.item label{ flex:1; cursor:pointer; }
.item .nm{ font-weight:500; }
.item .meta{ color:#7c8a93; font-size:.82rem; }
.item input[type=checkbox]{ width:20px; height:20px; accent-color:var(--coral); }
.qty{ display:flex; align-items:center; gap:8px; }
.qty button{ width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:1rem; cursor:pointer; }
.qty span{ min-width:18px; text-align:center; font-weight:600; }
.field{ margin-top:16px; }
.field label{ display:block; font-size:.85rem; color:#7c8a93; margin-bottom:6px; }
.field input[type=date]{ width:100%; padding:12px; border:1.5px solid var(--line); border-radius:12px; font-family:inherit; font-size:1rem; color:var(--navy); }
.slots{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.slot{ border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:9px 14px; font-weight:600; cursor:pointer; }
.slot:hover{ border-color:var(--coral); }
.slot.sel{ background:var(--coral); color:var(--navy); border-color:var(--coral); }
.slotmsg{ color:#7c8a93; font-size:.9rem; padding:8px 0; }
.summary{ background:var(--bg); border-radius:12px; padding:12px 14px; margin-top:14px; font-size:.92rem; }
.summary .tot{ display:flex; justify-content:space-between; font-weight:700; margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
.tel{ color:var(--coral); text-decoration:none; }

/* ══ SLOTBEE TEMA ══ */
body{ background:var(--sb-bg); font-family:var(--sb-sans); }
.wrap{ padding-top:32px; }
.brand{ display:flex; flex-direction:column; align-items:center; gap:10px; margin:0 0 22px; }
.brand img{ height:56px; }
.brand img:not([style*="display: none"]) + .brand-pecat{ display:none; }
.brand .nm{ font-family:var(--sb-serif); font-weight:500; font-size:1.7rem; letter-spacing:-.02em; margin:0; line-height:1.1; }
.brand .sb-eyebrow{ margin-top:2px; }
.card{ border:1px solid var(--sb-line); border-radius:24px; padding:26px 24px; box-shadow:var(--sb-shadow-lg); }
h1{ font-family:var(--sb-serif); font-weight:500; letter-spacing:-.02em; font-size:1.7rem; }
.sub, .row .k, .item .meta, .field label, .slotmsg, .loading{ color:var(--sb-muted); }
.row{ border-bottom:1px solid var(--sb-line-2); }
.note{ border-radius:14px; }
.note-info{ background:var(--sb-honey-soft); color:#6B4A07; }
.note-warn{ background:#FDF0D5; color:#7A5300; }
.note-ok{ background:var(--sb-ok-soft); color:var(--sb-ok); }
.note-bad{ background:var(--sb-napaka-soft); color:var(--sb-napaka); }
.b-nova{ background:var(--sb-honey-soft); color:var(--sb-honey-deep); }
.b-potrjeno{ background:var(--sb-ok-soft); color:var(--sb-ok); }
.b-preklicano{ background:var(--sb-napaka-soft); color:var(--sb-napaka); }
.btn{ border-radius:999px; min-height:50px; padding:0 22px; font-weight:600; font-size:.95rem; }
.btn-primary{ background:var(--sb-ink); color:#fff; box-shadow:0 10px 24px -12px rgba(22,24,29,.6); }
.btn-primary:hover{ background:#000; filter:none; }
.btn-primary:disabled{ background:var(--sb-muted); box-shadow:none; }
.btn-ghost{ border:1px solid var(--sb-line); }
.btn-ghost:hover{ border-color:var(--sb-ink); color:var(--sb-ink); }
.btn-danger{ border:1px solid #EBC3BA; color:var(--sb-napaka); }
.btn-danger:hover{ background:var(--sb-napaka-soft); }
.acc details{ border-radius:16px; border-color:var(--sb-line); background:#fff; }
.acc summary{ font-family:var(--sb-serif); font-weight:500; font-size:1.08rem; }
.acc summary .ar{ color:var(--sb-ink); }
.item{ border-top-color:var(--sb-line-2); }
.item input[type=checkbox]{ accent-color:var(--sb-ink); }
.qty button{ border-radius:50%; border-color:var(--sb-line); }
.field input[type=date]{ border:1px solid var(--sb-line); border-radius:14px; background:#fff; }
.field input[type=date]:focus{ outline:none; border-color:var(--sb-ink); box-shadow:0 0 0 3px var(--sb-honey-soft); }
.slot{ border:1px solid var(--sb-line); border-radius:12px; font-family:var(--sb-serif); font-weight:500; }
.slot:hover{ border-color:var(--sb-ink); }
.slot.sel{ background:var(--sb-honey-soft); color:var(--sb-ink); border-color:var(--sb-ink); }
.summary{ background:#fff; border:1px solid var(--sb-line); border-radius:16px; }
.summary .tot{ border-top-color:var(--sb-line); font-family:var(--sb-serif); font-weight:500; font-size:1.05rem; }
.brand{ min-height:176px; }
#app{ min-height:420px; }
@media (max-width:440px){ .actions .btn{ flex:1 1 100%; } }
.tel{ color:var(--sb-ink); font-weight:600; text-decoration:underline; text-decoration-color:var(--sb-honey); text-underline-offset:3px; }
</style>
