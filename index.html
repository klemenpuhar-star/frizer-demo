<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/pisave.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/ikone/favicon-48.png" sizes="48x48" type="image/png">

<title>Spletno naročanje — {IME}</title>
<meta name="description" content="Spletno naročanje na termin – izberite storitev in prosto uro.">
<script src="/nastavitve.js" data-stran="narocanje"></script>
<meta name="theme-color" content="#FBF8F3">
<!-- preverjanje telefonskih stevilk: Googlova knjiznica (za tuje stevilke) -->
<script src="/vendor/libphonenumber-max-1.13.16.js" defer></script>
  <script src="/js/telefon-narocanje.js?v=20261119"></script>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button, input, textarea, select { font-family: inherit; }   /* v41: gumbi so prej kazali Arial namesto pisave strani */
    :root {
      --bez:   #e8dfd3;
      --bez2:  #f7f3ee;
      --navy:  #1c1a19;
      --roza:  #8a6a3b;
      --opozorilo: #b23b3b;
      --coral: #b08d57;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--bez); color: var(--navy); overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    /* ── REVEAL (safe fallback: vedno vidno) ── */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible { opacity: 1; transform: none; }
    /* Če JS ne deluje ali prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
    }

    /* ── HEADER ── */
      display: inline-block; font-family: var(--sans);
      font-size: 0.82rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: #fff; background: var(--navy);
      padding: 0.9rem 2.4rem; border-radius: 40px; border: none; cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
    }
    .btn-main:hover { background: var(--roza); transform: translateY(-3px); box-shadow: 0 10px 24px rgba(138,106,59,.28); }

    /* ── SEKCIJA OKVIR ── */
    .bk-macc-item {
      background: #fff; border-radius: 12px; margin-bottom: .5rem;
      box-shadow: 0 1px 8px rgba(28,26,25,.06); overflow: hidden;
    }
    .bk-macc-trigger {
      width: 100%; text-align: left; border: none; background: none;
      padding: .85rem 1.1rem;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; gap: .8rem; transition: background .2s;
      font-family: var(--sans);
    }
    .bk-macc-trigger:hover { background: rgba(28,26,25,.03); }
    .bk-macc-cat { font-family: var(--serif); font-size: 1rem; font-weight: 600; color: var(--navy); }
    .bk-macc-cat.nujni { color: var(--opozorilo); }
    .bk-macc-arr {
      font-size: 1rem; color: var(--coral); flex-shrink: 0;
      transition: transform .3s cubic-bezier(.22,1,.36,1);
    }
    .bk-macc-item.open .bk-macc-arr { transform: rotate(45deg); }
    .bk-macc-body {
      max-height: 0; overflow: hidden;
      transition: max-height .38s cubic-bezier(.22,1,.36,1);
    }
    .bk-macc-item.open .bk-macc-body { max-height: 1600px; }
    .bk-macc-inner { padding: .1rem 1.1rem .85rem; }

    /* Checkbox vrstica */
    .bk-chk-row {
      display: flex; align-items: flex-start; gap: .75rem;
      padding: .52rem 0; border-bottom: 1px dotted rgba(28,26,25,.08);
      cursor: pointer;
    }
    .bk-chk-row:last-child { border: none; }
    .bk-chk-row input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: var(--navy);
      flex-shrink: 0; margin-top: 3px; cursor: pointer;
    }
    .bk-chk-left { flex: 1; min-width: 0; }
    .bk-chk-name { font-size: .87rem; color: var(--navy); line-height: 1.35; display: block; }
    .bk-chk-desc { font-size: .72rem; color: var(--coral); font-style: italic; margin-top: .1rem; display: block; }
    .bk-chk-dur { font-size: .72rem; color: rgba(28,26,25,.5); white-space: nowrap; flex-shrink: 0; padding-top: 3px; }
    .bk-chk-price { font-family: var(--serif); font-size: .95rem; font-weight: 600; color: var(--navy); white-space: nowrap; flex-shrink: 0; padding-top: 2px; }

    /* Opozorilo odvisnosti */
    /* inline opozorilo pod vrstico */
    .bk-dep-inline {
      font-size: .76rem; color: var(--opozorilo);
      padding: .28rem .6rem .28rem .4rem;
      background: rgba(178,59,59,.07);
      border-left: 2px solid var(--opozorilo);
      border-radius: 0 6px 6px 0;
      margin: .1rem 0 .3rem 1.9rem;
      display: none;
      line-height: 1.4;
    }
    .bk-dep-inline.show { display: block; }
    .bk-qty {
      display: flex; align-items: center; gap: .6rem;
      margin: .15rem 0 .5rem 1.9rem;
      font-size: .82rem; color: var(--navy);
    }
    .bk-qty-lbl { opacity: .75; }
    .bk-qty-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1.5px solid rgba(28,26,25,.2); background: #fff; color: var(--navy);
      font-size: 1.1rem; line-height: 1; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .bk-qty-btn:hover { border-color: var(--coral); color: var(--coral); }
    .bk-qty-n { min-width: 1.4rem; text-align: center; font-weight: 600; font-size: .95rem; }

    /* Povzetek izbranih */
    .bk-sel-summary {
      margin-top: 1rem; background: var(--bez2); border-radius: 12px;
      padding: .85rem 1rem;
    }
    .bk-sel-label { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--coral); margin-bottom: .5rem; }
    .bk-sel-list { font-size: .82rem; color: var(--navy); line-height: 1.7; margin-bottom: .5rem; }
    .bk-sel-list:empty::before { content: "Ni izbranih storitev."; opacity: .45; }
    .bk-sel-totals { display: flex; gap: 1.2rem; flex-wrap: wrap; }
    .bk-sel-tot { font-size: .82rem; }
    .bk-sel-tot strong { font-family: var(--serif); font-size: 1rem; color: var(--navy); }
    /* ── TERMINSKI TRAK (novi dizajn) ── */
    .bk-sched-wrap {
      display: flex; gap: 1.2rem;
      align-items: flex-start;
    }
    .bk-sched-left { flex: 1; min-width: 0; }
    .bk-sched-right {
      width: 230px; flex-shrink: 0;
      background: #fff; border-radius: 14px;
      padding: 1rem; box-shadow: 0 2px 12px rgba(28,26,25,.08);
      font-size: .82rem;
    }
    @media (max-width: 600px) {
      .bk-sched-wrap { flex-direction: column; }
      .bk-sched-right { width: 100%; }
    }

    /* Dan trak */
    .bk-day-nav {
      display: flex; align-items: center; gap: .4rem; margin-bottom: .7rem;
    }
    .bk-day-nav-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid rgba(28,26,25,.2); background: none;
      cursor: pointer; font-size: .9rem; color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s; flex-shrink: 0;
    }
    .bk-day-nav-btn:hover:not(:disabled) { background: rgba(28,26,25,.07); }
    .bk-day-nav-btn:disabled { opacity: .3; cursor: not-allowed; }
    .bk-day-strip-outer { flex: 1; overflow: hidden; }
    .bk-day-strip {
      display: flex; gap: .4rem;
      scroll-behavior: smooth; scrollbar-width: none;
      padding-bottom: 2px;
    }
    .bk-day-strip::-webkit-scrollbar { display: none; }

    .bk-day-card {
      flex: 1 1 0; min-width: 0;
      border: 1.5px solid rgba(28,26,25,.12); border-radius: 12px;
      background: #fff; cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
      overflow: hidden; text-align: center;
      font-family: var(--sans);
    }
    .bk-day-card:hover:not(.disabled) { border-color: var(--coral); }
    .bk-zap { display:flex; flex-wrap:wrap; gap:.45rem; margin:0 0 1rem; }
    .bk-zap-lbl { width:100%; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; opacity:.7; margin-bottom:.1rem; }
    .bk-zap-btn { font:inherit; font-size:.86rem; padding:.5rem 1rem; border-radius:999px; border:1.5px solid rgba(0,0,0,.16); background:#fff; color:var(--navy); cursor:pointer; display:inline-flex; align-items:center; gap:.4rem; }
    .bk-zap-btn .pika { width:.6rem; height:.6rem; border-radius:50%; display:inline-block; }
    .bk-zap-btn.selected { background:var(--navy); color:#fff; border-color:var(--navy); }
    .bk-day-card.selected { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(28,26,25,.12); }
    .bk-day-card.disabled { opacity: .38; cursor: not-allowed; }

    .bk-day-card-top { padding: .5rem .3rem .3rem; }
    .bk-day-name { font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; color: rgba(28,26,25,.5); }
    .bk-day-num  { font-family: var(--serif); font-size: 1.55rem; font-weight: 300; color: var(--navy); line-height: 1.1; }
    .bk-day-mon  { font-size: .65rem; color: rgba(28,26,25,.45); }
    .bk-day-status {
      padding: .28rem .2rem; font-size: .62rem; text-align: center;
      border-top: 1px solid rgba(28,26,25,.07); line-height: 1.2;
    }
    .bk-day-status.avail  { color: var(--coral); font-weight: 500; }
    .bk-day-status.busy   { color: rgba(28,26,25,.35); }
    .bk-day-status.closed { color: rgba(28,26,25,.3); font-style: italic; }

    /* Termini – mreža kvadratkov */
    .bk-slot-list {
      margin-top: .8rem;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: .5rem;
    }
    .bk-slot-row {
      display: flex; flex-direction: row;
      align-items: center; justify-content: center; gap: .35rem;
      min-height: 52px; padding: .6rem .9rem;
      border-radius: 12px; border: 1.5px solid rgba(28,26,25,.12);
      cursor: pointer; background: #fff; text-align: left;
      transition: border-color .2s, background .2s;
    }
    .bk-slot-row:hover { border-color: var(--coral); }
    .bk-slot-row.selected {
      border-color: var(--coral); background: rgba(176,141,87,.08);
    }
    .bk-slot-time { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; color: var(--navy); line-height: 1; white-space: nowrap; }
    .bk-slot-price { font-size: .8rem; color: var(--coral); white-space: nowrap; }

    @media (max-width: 600px) {
      .bk-slot-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .bk-slot-row { padding: .5rem .5rem; min-height: 44px; }
      .bk-slot-time { font-size: .92rem; }
      .bk-slot-price { font-size: .68rem; }
    }

    /* Povzetek (desno) */
    .bk-sum-hd { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--coral); margin-bottom: .5rem; }
    .bk-sum-date { font-family: var(--serif); font-size: .95rem; color: var(--navy); margin-bottom: .7rem; line-height: 1.4; }
    .bk-sum-svc  { font-size: .78rem; color: rgba(28,26,25,.65); padding: .2rem 0; border-bottom: 1px dotted rgba(28,26,25,.08); display: flex; justify-content: space-between; gap: .4rem; }
    .bk-sum-svc:last-of-type { border: none; }
    .bk-sum-total { font-family: var(--serif); font-size: 1rem; font-weight: 600; color: var(--navy); margin-top: .6rem; display: flex; justify-content: space-between; }

    .bk-slot-msg {
      font-size: .85rem; color: rgba(28,26,25,.55); padding: .8rem 0;
      text-align: center; line-height: 1.6;
    }
    .bk-slot-loading { text-align: center; padding: 1rem; opacity: .5; font-size: .85rem; }

    /* ══ BOOKING MODAL ══════════════════════════════════════════ */
    .bk-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(28,26,25,.55); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
    }
    .bk-overlay.open { opacity: 1; pointer-events: all; }

    .bk-modal {
      background: var(--bez2);
      border-radius: 24px;
      width: 100%; max-width: 560px;
      max-height: 92vh; overflow-y: auto; overflow-x: hidden;
      box-shadow: 0 24px 60px rgba(28,26,25,.22);
      transform: translateY(24px) scale(.98);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
      scrollbar-width: none;
    }
    .bk-modal::-webkit-scrollbar { display: none; }
    .bk-overlay.open .bk-modal { transform: none; }
    .bk-modal.bk-modal-wide { max-width: min(1180px, 94vw); }

    .bk-head {
      position: sticky; top: 0; z-index: 10;
      background: var(--bez2);
      padding: 1.4rem 1.6rem 0;
      border-bottom: 1px solid rgba(28,26,25,.08);
    }
    .bk-head-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .bk-modal-title { font-family: var(--serif); font-size: 1.4rem; font-weight: 300; color: var(--navy); }
    .bk-close {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(28,26,25,.08); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--navy);
      transition: background .2s;
    }
    .bk-close:hover { background: rgba(28,26,25,.16); }

    /* Step indicator */
    .bk-steps { display: flex; gap: 0; margin-bottom: 0; }
    .bk-step-dot {
      flex: 1; height: 3px;
      background: rgba(28,26,25,.15);
      border-radius: 2px;
      margin: 0 2px;
      transition: background .3s;
    }
    .bk-step-dot.done { background: var(--coral); }
    .bk-step-dot.active { background: var(--navy); }

    .bk-body { padding: 1.6rem; }

    /* Step label */
    .bk-step-label {
      font-size: 0.72rem; letter-spacing: .18em; text-transform: uppercase;
      color: var(--coral); margin-bottom: .3rem;
    }
    .bk-step-title {
      font-family: var(--serif); font-size: 1.15rem; color: var(--navy);
      margin-bottom: 1.2rem;
    }

    /* Services */
    .bk-cat-label {
      font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--coral); margin: 1rem 0 .4rem;
    }
    .bk-cat-label:first-child { margin-top: 0; }

    .bk-service-btn {
      width: 100%; text-align: left;
      background: #fff; border: 1.5px solid transparent;
      border-radius: 12px; padding: .7rem 1rem;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .4rem;
      transition: border-color .2s, box-shadow .2s;
      font-family: var(--sans);
    }
    .bk-service-btn:hover { border-color: var(--coral); }
    .bk-service-btn.selected { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(28,26,25,.08); }
    .bk-svc-name { font-size: .9rem; color: var(--navy); line-height: 1.35; }
    .bk-svc-dur { font-size: .72rem; color: var(--coral); }
    .bk-svc-price { font-family: var(--serif); font-size: 1rem; font-weight: 600; color: var(--navy); white-space: nowrap; margin-left: .8rem; }

    /* Calendar */
    .bk-cal { background: #fff; border-radius: 14px; padding: 1rem; }
    .bk-cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: .8rem; }
    .bk-cal-month { font-family: var(--serif); font-size: 1.1rem; color: var(--navy); }
    .bk-cal-arrow {
      background: none; border: 1px solid rgba(28,26,25,.2); border-radius: 8px;
      width: 30px; height: 30px; cursor: pointer; font-size: .9rem; color: var(--navy);
      transition: background .2s;
    }
    .bk-cal-arrow:hover { background: rgba(28,26,25,.07); }
    .bk-cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .bk-cal-dh { text-align: center; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--coral); padding: .3rem 0; }
    .bk-cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: .85rem; color: var(--navy);
      cursor: pointer; border: none; background: none;
      transition: background .2s, color .2s;
    }
    .bk-cal-day:hover:not(:disabled) { background: rgba(28,26,25,.08); }
    .bk-cal-day.selected { background: var(--navy); color: #fff; }
    .bk-cal-day.today { font-weight: 600; color: var(--coral); }
    .bk-cal-day:disabled { opacity: .28; cursor: not-allowed; }
    .bk-cal-day.empty { cursor: default; }

    /* Time slots */
    .bk-slots { display: grid; grid-template-columns: repeat(4,1fr); gap: .5rem; }
    @media(max-width:400px){ .bk-slots { grid-template-columns: repeat(3,1fr); } }
    .bk-slot {
      padding: .55rem .3rem; border-radius: 10px; border: 1.5px solid rgba(28,26,25,.18);
      background: #fff; cursor: pointer; font-size: .85rem; text-align: center; color: var(--navy);
      transition: border-color .2s, background .2s;
    }
    .bk-slot:hover { border-color: var(--coral); }
    .bk-slot.selected { background: var(--navy); color: #fff; border-color: var(--navy); }

    /* Nujni termin special */
    .bk-nujni-box {
      background: #fff; border-radius: 14px; padding: 1.2rem;
      border-left: 3px solid var(--coral);
      font-size: .88rem; line-height: 1.7; color: var(--navy);
      margin-bottom: 1rem;
    }
    .bk-nujni-label { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--coral); margin-bottom: .3rem; }

    /* Customer form */
    .bk-field { margin-bottom: 1rem; }
    .bk-label {
      display: block; font-size: .75rem; letter-spacing: .12em;
      text-transform: uppercase; color: var(--coral); margin-bottom: .35rem;
    }
    .bk-input, .bk-textarea {
      width: 100%; background: #fff; border: 1.5px solid rgba(28,26,25,.2);
      border-radius: 10px; padding: .65rem .9rem;
      font-family: var(--sans); font-size: .9rem; color: var(--navy);
      transition: border-color .2s;
      outline: none;
    }
    .bk-input:focus, .bk-textarea:focus { border-color: var(--navy); }
    .bk-textarea { resize: vertical; min-height: 70px; }
    .bk-input.err, .bk-textarea.err { border-color: #d64545; box-shadow: 0 0 0 2px rgba(214,69,69,.15); }
    /* preverjanje telefonske stevilke (telefon.js) */
    .tel-msg { font-size: .8rem; line-height: 1.4; margin-top: .4rem; }
    .tel-msg:empty { display: none; }
    .tel-napaka { color: #c0392b; }
    .tel-opozorilo { color: #9a5b00; background: #fff4e0; border-radius: 8px; padding: .45rem .65rem; }
    .tel-ok { color: #3f8f5b; }

    /* Summary */
    .bk-summary {
      background: #fff; border-radius: 14px; padding: 1.2rem;
    }
    .bk-sum-row {
      display: flex; justify-content: space-between; gap: .5rem;
      padding: .45rem 0; border-bottom: 1px dotted rgba(28,26,25,.1);
      font-size: .88rem;
    }
    .bk-sum-row:last-child { border: none; }
    .bk-sum-key { color: var(--coral); flex-shrink: 0; }
    .bk-sum-val { color: var(--navy); text-align: right; }

    /* Success */
    .bk-success { text-align: center; padding: 1.5rem 0; }
    .bk-success-icon { font-size: 3rem; margin-bottom: .6rem; }
    .bk-success-title { font-family: var(--serif); font-size: 1.4rem; color: var(--navy); margin-bottom: .5rem; }
    .bk-success-sub { font-size: .9rem; opacity: .7; line-height: 1.7; }

    /* Error */
    .bk-error { background: rgba(178,59,59,.08); border: 1px solid rgba(178,59,59,.25); border-radius: 10px; padding: .8rem 1rem; font-size: .85rem; color: var(--opozorilo); margin-bottom: 1rem; display: none; }
    .bk-error.show { display: block; }

    /* Loading */
    .bk-loading { text-align: center; padding: 2rem; opacity: .5; font-size: .9rem; }

    /* Footer nav */
    .bk-foot {
      padding: 1rem 1.6rem 1.4rem;
      display: flex; gap: .8rem; justify-content: flex-end;
      border-top: 1px solid rgba(28,26,25,.08);
      background: var(--bez2);
      position: sticky; bottom: 0;
    }
    .bk-btn-back {
      background: none; border: 1.5px solid rgba(28,26,25,.25); border-radius: 30px;
      padding: .6rem 1.4rem; font-family: var(--sans); font-size: .82rem;
      letter-spacing: .1em; text-transform: uppercase; cursor: pointer; color: var(--navy);
      transition: border-color .2s;
    }
    .bk-btn-back:hover { border-color: var(--navy); }
    .bk-btn-next {
      background: var(--navy); color: #fff; border: none; border-radius: 30px;
      padding: .6rem 1.6rem; font-family: var(--sans); font-size: .82rem;
      letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
      transition: background .25s, transform .25s;
    }
    .bk-btn-next:hover { background: var(--roza); transform: translateY(-1px); }
    .bk-btn-next:disabled { opacity: .45; cursor: not-allowed; transform: none; }


    /* ── DOSTOPNOST (okno za naročanje) ──
       Samo znotraj okna za naročanje (#bkOverlay). Barve in razporeditev ostanejo,
       popravljeno je le: velikost pisave v poljih (iPhone se ne poveča vec ob dotiku),
       velikost gumbov za prst (min. 44px), kontrast drobnega besedila, fokus za tipkovnico. */
    #bkOverlay { --coral-txt: var(--sb-honey-deep, #8F6107); }
    #bkOverlay .bk-input, #bkOverlay .bk-textarea { font-size: 16px; }
    #bkOverlay .bk-close { position: relative; }
    #bkOverlay .bk-close::after,
    #bkOverlay .bk-day-nav-btn::after { content: ''; position: absolute; inset: -8px; }
    #bkOverlay .bk-day-nav-btn { position: relative; }
    #bkOverlay .bk-btn-back, #bkOverlay .bk-btn-next { min-height: 44px; }
    #bkOverlay .bk-chk-row { min-height: 44px; }
    #bkOverlay .bk-chk-row input[type="checkbox"] { width: 18px; height: 18px; }
    #bkOverlay .bk-step-label, #bkOverlay .bk-label, #bkOverlay .bk-chk-desc,
    #bkOverlay .bk-sel-label, #bkOverlay .bk-sum-hd, #bkOverlay .bk-sum-key,
    #bkOverlay .bk-day-status.avail, #bkOverlay .bk-macc-arr { color: var(--coral-txt); }
    #bkOverlay .bk-chk-dur, #bkOverlay .bk-day-name, #bkOverlay .bk-day-mon { color: rgba(28,26,25,.75); }
    #bkOverlay .bk-success-sub { opacity: .85; }
    #bkOverlay .bk-sum-svc { color: rgba(28,26,25,.8); }
    #bkOverlay .bk-slot-msg { color: rgba(28,26,25,.75); opacity: 1; }
    #bkOverlay .bk-pogoj { font-size: .78rem; opacity: .75; margin-top: 1rem; line-height: 1.6; }
    #bkOverlay .bk-tel-povezava { color: var(--navy); font-weight: 600; text-decoration: underline;
      text-decoration-color: var(--coral); text-underline-offset: 3px;
      display: inline-block; padding: .75rem .25rem; margin: -.75rem 0; }
    #bkOverlay :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    /* na telefonu (brez miške) gumb po dotiku ne ostane v »hover« barvi z manjšim kontrastom */
    @media (hover: none) {
      #bkOverlay .bk-btn-next:hover { background: var(--navy); transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #bkOverlay *, #bkOverlay *::before, #bkOverlay *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
