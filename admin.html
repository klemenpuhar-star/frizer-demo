<style>
:root{--bez:#e8dfd3;--bez2:#f7f3ee;--navy:#1c1a19;--coral:#b08d57;--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bez2);color:var(--navy);min-height:100vh}
.hidden{display:none!important}
a{color:inherit}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.login-card{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(28,26,25,.12);padding:2.4rem 2rem;width:100%;max-width:380px;text-align:center}
.login-card .login-logo{width:100%;max-width:230px;height:auto;display:block;margin:0 auto .4rem}
.login-card .sub{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);margin-bottom:1.6rem}
.field{text-align:left;margin-bottom:1rem}
.field label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:.35rem}
.field input{width:100%;padding:.7rem .8rem;border:1.5px solid rgba(28,26,25,.15);border-radius:10px;font-family:var(--sans);font-size:.95rem;color:var(--navy)}
.field input:focus{outline:none;border-color:var(--coral)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:none;border-radius:999px;cursor:pointer;font-family:var(--sans);transition:.2s}
.btn-main{background:var(--coral);color:var(--navy);padding:.75rem 1.4rem;font-size:.85rem;width:100%}
.btn-main:hover{filter:brightness(.95)}
.btn-main:disabled{opacity:.6}
.msg{font-size:.82rem;margin-top:.9rem;min-height:1em}
.msg.err{color:#b04a3a}
.msg.ok{color:#2f6b43}
.link-btn{background:none;border:none;color:var(--coral);font-size:.78rem;cursor:pointer;margin-top:.8rem;text-decoration:underline;font-family:var(--sans);padding:0}
#newbk input.err,#nbServices.err{border-color:#d64545 !important;box-shadow:0 0 0 2px rgba(214,69,69,.15)}

header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 4%;height:60px;background:rgba(247,243,238,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(28,26,25,.1)}
header .brand{display:flex;align-items:center;gap:.55rem}
header .brand .logo-img{height:36px;width:auto;display:block}
header .brand .brand-tag{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
header .right{display:flex;align-items:center;gap:.9rem}
header .who{font-size:.74rem;opacity:.65}
header .who.z-nazivom{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;opacity:1}
header .who .who-naziv{font-size:.86rem;font-weight:600;color:var(--navy);max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .who .who-mail{opacity:.65}
@media(max-width:820px){header .who.z-nazivom{display:flex!important}header .who.z-nazivom .who-mail{display:none}header .who .who-naziv{max-width:9.5rem;font-size:.8rem}}
.btn-ghost{background:#fff;border:1.5px solid rgba(28,26,25,.2);color:var(--navy);padding:.45rem .9rem;font-size:.74rem;border-radius:999px;cursor:pointer}
.btn-ghost:hover{border-color:var(--coral);color:var(--coral)}

.toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:1rem 1.5rem .4rem}
.nav-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(28,26,25,.15);background:#fff;cursor:pointer;font-size:1rem;color:var(--navy)}
.nav-btn:hover{border-color:var(--coral);color:var(--coral)}
.range{font-family:var(--serif);font-size:1.25rem;margin:0 .4rem;min-width:160px}
.seg{display:flex;border:1.5px solid rgba(28,26,25,.15);border-radius:999px;overflow:hidden;background:#fff;margin-left:auto;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:.45rem .85rem;font-size:.76rem;cursor:pointer;color:var(--navy);font-family:var(--sans)}
.seg button.active{background:var(--navy);color:#fff}

.wrap{padding:.4rem 1.5rem 3rem}
.layout{display:flex;gap:1.2rem;align-items:flex-start}
.side{width:230px;flex-shrink:0;position:sticky;top:72px}
.main{flex:1;min-width:0}
.mini-stack{max-height:none;overflow:visible;display:flex;flex-direction:column;gap:.8rem;padding-right:4px}
.mini-stack::-webkit-scrollbar{width:0;height:0}
.mini-stack::-webkit-scrollbar-thumb{background:rgba(28,26,25,.2);border-radius:3px}
@media(max-width:820px){.layout{flex-direction:column;align-items:stretch}.main{width:100%}.side{width:100%;max-width:none;position:static}.mini-stack{max-height:none}.cal.multi{min-width:0}.who{display:none}.toolbar{padding:.8rem 1rem .4rem;gap:.5rem}.wrap{padding:.4rem 1rem 3rem}.range{flex:1 1 auto;text-align:right;font-size:1.05rem;min-width:0;margin:0}#newBtn,#blockToggle{flex:1 1 0;text-align:center}.seg{width:100%;margin-left:0;flex-wrap:nowrap;margin-top:.1rem}.seg button{flex:1;padding:.5rem .15rem;font-size:.72rem;text-align:center}}

/* Mini koledar */
.mini{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(28,26,25,.07);padding:.9rem}
.mini-head{display:flex;align-items:center;justify-content:center;margin-bottom:.5rem;font-family:var(--serif);font-size:1.05rem}
.mini-day.empty{visibility:hidden;cursor:default}
.mini-nav{border:none;background:transparent;cursor:pointer;font-size:1.1rem;color:var(--navy);padding:.1rem .45rem;border-radius:6px}
.mini-nav:hover{color:var(--coral)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto;grid-auto-rows:1.7rem;align-content:start;gap:2px}
.mini-dow{font-size:.6rem;text-align:center;opacity:.5;padding:.2rem 0}
.mini-day{border:none;background:transparent;cursor:pointer;font-size:.74rem;height:1.7rem;display:flex;align-items:center;justify-content:center;line-height:1;border-radius:8px;color:var(--navy)}
.mini-day:hover{background:rgba(176,141,87,.12)}
.mini-day.out{opacity:.3}
.mini-day.today{color:var(--coral);font-weight:600}
.mini-day.sel{background:var(--navy);color:#fff}
.mini-day.praznik{color:#b4714f;font-weight:700;text-decoration:underline;text-decoration-color:rgba(180,113,79,.4)}

/* Časovni koledar */
.cal-scroll{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(28,26,25,.08)}
.cal{min-width:100%}
.cal.multi{min-width:660px}
.cal-head{display:grid;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #eceae6}
.cal-body{display:grid}
.dayhead{padding:.6rem .3rem;text-align:center;border-left:1px solid #f2eee8}
.dayhead .dow{font-size:.64rem;letter-spacing:.1em;opacity:.55;text-transform:uppercase}
.dayhead .dnum{font-family:var(--serif);font-size:1.3rem;line-height:1.05;white-space:nowrap}
.dayhead.today .dnum{color:var(--coral)}
@media(max-width:820px){.dayhead .dnum{font-size:.82rem}}
.dayhead.off{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f2f2f2 6px,#f2f2f2 12px)}
.dayhead.arr{background:rgba(176,141,87,.08)}
.dayhead .praznik{font-size:.56rem;line-height:1.15;color:#b4714f;font-weight:600;margin-top:2px;
  white-space:normal;overflow-wrap:break-word;padding:0 2px}
@media(max-width:820px){.dayhead .praznik{font-size:.5rem}}
.gutter{position:relative;height:624px}
.gutter .hr{position:absolute;right:6px;font-size:.64rem;opacity:.5;transform:translateY(-50%)}
.col{position:relative;height:624px;border-left:1px solid #f2eee8;background:repeating-linear-gradient(to bottom,transparent,transparent 51px,#f0f1f1 51px,#f0f1f1 52px)}
.off-band{position:absolute;left:0;right:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(45deg,rgba(28,26,25,.035),rgba(28,26,25,.035) 7px,rgba(28,26,25,.07) 7px,rgba(28,26,25,.07) 14px)}
.off-band.arr{background:repeating-linear-gradient(45deg,rgba(176,141,87,.06),rgba(176,141,87,.06) 7px,rgba(176,141,87,.12) 7px,rgba(176,141,87,.12) 14px)}
.ev{position:absolute;left:3px;right:3px;z-index:2;border-radius:7px;padding:2px 7px;font-size:.7rem;line-height:1.12;cursor:pointer;overflow:hidden;border-left:4px solid var(--coral);background:#f3eee7;color:var(--navy)}
.ev:hover{filter:brightness(.97);box-shadow:0 2px 8px rgba(28,26,25,.15)}
.ev .ev-t{font-size:.62rem;opacity:.7}
.zap-pika{display:inline-block;width:.62em;height:.62em;border-radius:50%;margin-right:.35em;vertical-align:.02em;flex:0 0 auto}
.zap-filter{font:inherit;font-size:.82rem;padding:.4rem .7rem;border-radius:999px;border:1.5px solid rgba(28,26,25,.18);background:#fff;color:var(--navy);max-width:12rem}
.dayhead .zap-ime{font-weight:600;letter-spacing:.02em;text-transform:none}
.ev.zap-tuj{opacity:.6;border-left-style:dashed}
body.vloga-recepcija #uvozBtn,body.vloga-recepcija #blExp,body.vloga-recepcija .bl-del,body.vloga-recepcija .bl-mesec{display:none!important}
.ev .ev-n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .ev-s{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.potrjeno{background:#e6f0e9;border-left-color:#3f8f5b}
.ev.opravljeno{background:#e4e9ec;border-left-color:var(--navy);opacity:.85}
.ev.preklicano{background:#f2e3e0;border-left-color:#b04a3a;opacity:.5;text-decoration:line-through}
.ev.block{background:repeating-linear-gradient(45deg,#a39a8f,#a39a8f 9px,#968d82 9px,#968d82 18px);
  border-left:5px solid #8f4334;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.block .ev-t{color:rgba(255,255,255,.9);font-size:.72rem}
.block .ev-n{color:#fff;font-size:.95rem;font-weight:700;line-height:1.2;letter-spacing:.01em;
  white-space:normal;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.block .ev-s{color:rgba(255,255,255,.95);font-size:.8rem;font-weight:500;white-space:normal}
.ev .ev-st{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.6);z-index:3}
.st-nova{background:#e0a23c}.st-potrjeno{background:#3f8f5b}.st-opravljeno{background:#8a97a0}.st-preklicano{background:#b04a3a}.st-podogovoru{background:#b08d57}
.cat-legend{display:flex;flex-wrap:wrap;gap:.35rem .8rem;align-items:center;padding:.55rem 4% .2rem}
.cat-legend .lg{display:inline-flex;align-items:center;gap:.35rem;font-size:.7rem;color:var(--navy);opacity:.85}
.cat-legend .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.mcell .mdots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;padding-right:1.3rem}
.mcell .mdot{width:6px;height:6px;border-radius:50%}

/* Mesečni pregled */
.month{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(28,26,25,.08);padding:1rem}
.month .mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.month .mhead div{text-align:center;font-size:.64rem;letter-spacing:.08em;opacity:.55;text-transform:uppercase}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcell{position:relative;min-height:74px;border:1px solid #f2eee8;border-radius:10px;background:#fff;cursor:pointer;text-align:left;padding:.4rem;color:var(--navy)}
.mcell:hover{border-color:var(--coral)}
.mcell .mnum{font-family:var(--serif);font-size:1.05rem}
.mcell.out{opacity:.4}
.mcell.today{border-color:var(--coral);box-shadow:0 0 0 2px rgba(176,141,87,.2)}
.mcell.off{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f2f2f2 6px,#f2f2f2 12px)}
.mcell .mcount{position:absolute;right:.4rem;bottom:.4rem;background:var(--coral);color:var(--navy);font-size:.66rem;border-radius:999px;padding:.05rem .45rem}
.mcell .mpraznik{font-size:.6rem;line-height:1.15;color:#b4714f;font-weight:600;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.mcell{min-height:54px;padding:.3rem}.mcell .mnum{font-size:.9rem}.mcell .mpraznik{font-size:.52rem}}

/* Nujni seznam */
.cards{display:flex;flex-direction:column;gap:.8rem}
.empty{text-align:center;opacity:.55;padding:2.5rem 0;font-style:italic}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(28,26,25,.07);padding:1rem 1.1rem;display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.card .body{flex:1;min-width:200px}
.card .svc{font-weight:500;margin-bottom:.25rem}
.card .meta{font-size:.82rem;opacity:.8;line-height:1.5}
.card .meta a{color:var(--coral);text-decoration:none}
.card .side2{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
.price{font-family:var(--serif);font-size:1.2rem;font-weight:600}

.badge{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:999px;display:inline-block}
.badge.nova{background:rgba(28,26,25,.1);color:var(--navy)}
.badge.potrjeno{background:rgba(70,140,90,.16);color:#2f6b43}
.badge.opravljeno{background:rgba(28,26,25,.85);color:#fff}
.badge.preklicano{background:rgba(176,74,58,.15);color:#b04a3a}
.badge.podogovoru{background:rgba(176,141,87,.18);color:var(--coral)}
.act{font-size:.72rem;padding:.4rem .7rem;border-radius:999px;border:1.5px solid rgba(28,26,25,.18);background:#fff;cursor:pointer;color:var(--navy)}
.act:hover{border-color:var(--coral);color:var(--coral)}
.act.danger:hover{border-color:#b04a3a;color:#b04a3a}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(28,26,25,.4);display:flex;align-items:center;justify-content:center;padding:1.2rem}
.pop{background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(28,26,25,.25);width:100%;max-width:420px;padding:1.5rem;position:relative}
.pop .x{position:absolute;top:.7rem;right:.9rem;border:none;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--navy)}
.pop .d-date{font-size:.78rem;opacity:.6}
.pop .d-time{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:.1rem 0 .5rem}
.pop .d-svc{font-weight:500;margin-bottom:.5rem}
.pop .d-meta{font-size:.86rem;opacity:.85;line-height:1.6;margin-bottom:.6rem}
.pop .d-meta a{color:var(--coral);text-decoration:none}
.pop .d-note{font-size:.84rem;font-style:italic;opacity:.75;border-left:2px solid var(--coral);padding-left:.5rem;margin-bottom:.6rem}
.pop .d-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.pop .d-edit{margin:.2rem 0 .9rem;padding:.7rem .8rem;background:rgba(28,26,25,.045);border-radius:12px}
.pop .d-edit-hd{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin-bottom:.5rem}
.pop .d-edit-row{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.55rem}
.pop .d-edit-row label{flex:1 1 90px;display:flex;flex-direction:column;gap:.22rem;font-size:.72rem;opacity:.7}
.pop .d-edit-row input{font:inherit;font-size:.9rem;padding:.45rem .5rem;border:1.5px solid rgba(28,26,25,.18);border-radius:8px;background:#fff;color:var(--navy)}
.act.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.act.save:hover{background:#0f0e0d;color:#fff;border-color:#0f0e0d}
.d-edit-msg{font-size:.78rem;margin-top:.35rem;min-height:1em}
.d-edit-msg.ok{color:#3f8f5b}.d-edit-msg.err{color:#b04a3a}
.pop .d-actions{display:flex;gap:.4rem;flex-wrap:wrap}

.tip{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid rgba(28,26,25,.12);box-shadow:0 8px 28px rgba(28,26,25,.18);border-radius:12px;padding:.65rem .8rem;max-width:250px;font-size:.8rem;line-height:1.45;color:var(--navy)}
.tip .tip-t{font-family:var(--serif);font-size:1.05rem;font-weight:600}
.tip .tip-n{font-weight:500}
.tip .tip-row{opacity:.82}
.tip .tip-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.4rem}
.tip .tip-price{font-family:var(--serif);font-weight:600}

.pop-wide{max-width:560px;max-height:90vh;overflow-y:auto}
.nb-title{font-family:var(--serif);font-weight:300;font-size:1.6rem;margin-bottom:1rem}
.nb-grid{display:flex;gap:1rem;flex-wrap:wrap}
.nb-grid label{flex:1;min-width:140px}
/* preverjanje telefonske stevilke (telefon.js) */
.tel-msg{font-size:.78rem;line-height:1.4;margin:-.45rem 0 .8rem}
.tel-msg:empty{display:none}
.tel-napaka{color:#c0392b}
.tel-opozorilo{color:#9a5b00;background:#fff4e0;border-radius:8px;padding:.45rem .65rem}
.tel-ok{color:#3f8f5b}
/* povzetek virov spletnih rezervacij (Stranke) */
.vir-box{background:#fff;border-radius:12px;padding:.85rem 1rem;margin:0 0 1rem;box-shadow:0 1px 6px rgba(28,26,25,.06)}
.vir-hd{font-size:.82rem;font-weight:600;color:var(--navy);margin-bottom:.55rem}
.vir-hd span{font-weight:400;opacity:.6}
.vir-vr{display:flex;align-items:center;gap:.6rem;font-size:.82rem;padding:.18rem 0}
.vir-ime{flex:0 0 42%;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vir-trak{flex:1;height:8px;background:#f1ebe4;border-radius:999px;overflow:hidden}
.vir-trak i{display:block;height:100%;background:var(--coral);border-radius:999px}
.vir-st{flex:0 0 2.2rem;text-align:right;font-weight:600;color:var(--navy)}
.vir-prazno{font-size:.8rem;opacity:.65}
.pop-wide label{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-bottom:.8rem}
.pop-wide input{display:block;width:100%;margin-top:.3rem;padding:.55rem .7rem;border:1.5px solid rgba(28,26,25,.15);border-radius:10px;font-family:var(--sans);color:var(--navy)}
.pop-wide input:focus{outline:none;border-color:var(--coral)}
.nb-svc-label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-bottom:.4rem}
.nb-services{max-height:320px;overflow-y:auto;border:1.5px solid rgba(28,26,25,.12);border-radius:12px;padding:.55rem;margin-bottom:.8rem;background:rgba(28,26,25,.02)}
.nb-cat{font-family:var(--serif);font-size:1.05rem;margin:.7rem 0 .25rem}
.nb-cat:first-child{margin-top:0}
.nb-acc-item{background:#fff;border:1px solid rgba(28,26,25,.1);border-radius:10px;margin-bottom:.45rem;overflow:hidden}
.nb-acc-item:last-child{margin-bottom:0}
.nb-acc-trigger{width:100%;text-align:left;border:none;background:none;padding:.6rem .85rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:.6rem;font-family:var(--sans)}
.nb-acc-trigger:hover{background:rgba(28,26,25,.03)}
.nb-acc-cat{font-family:var(--serif);font-size:1rem;font-weight:600;color:var(--navy)}
.nb-acc-cat.nujni{color:var(--coral)}
.nb-acc-arr{font-size:1.05rem;color:var(--coral);flex-shrink:0;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.nb-acc-item.open .nb-acc-arr{transform:rotate(45deg)}
.nb-acc-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.22,1,.36,1)}

/* drsenje med dnevi */
@keyframes appSwipeL{ from{opacity:.35;transform:translateX(26px)} to{opacity:1;transform:none} }
@keyframes appSwipeR{ from{opacity:.35;transform:translateX(-26px)} to{opacity:1;transform:none} }
.swipe-l{ animation:appSwipeL .22s ease-out }
.swipe-r{ animation:appSwipeR .22s ease-out }
/* mehak prehod med dnevi: animira se vsebina, drsni okvir ostane na mestu */
.cal.vstop-l{ animation:appVstopL .2s ease-out }
.cal.vstop-r{ animation:appVstopR .2s ease-out }
@keyframes appVstopL{ from{opacity:.4;transform:translateX(22px)} to{opacity:1;transform:none} }
@keyframes appVstopR{ from{opacity:.4;transform:translateX(-22px)} to{opacity:1;transform:none} }
.cal-scroll.osvezujem{ opacity:.55; transition:opacity .12s }
.cal-scroll{ overscroll-behavior-y:contain; scroll-behavior:auto }
/* dnevni/tedenski koledar: lasten navpicni drsnik (00:00–24:00, ob odprtju 6:00–21:00) */
.cal-scroll{ overflow-y:auto; height:calc(100dvh - 215px);
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain; scrollbar-width:thin; }
.cal-scroll::-webkit-scrollbar{ width:10px; height:10px }
.cal-scroll::-webkit-scrollbar-thumb{ background:rgba(28,26,25,.22); border-radius:999px;
  border:3px solid #fff }
.cal-scroll::-webkit-scrollbar-thumb:hover{ background:rgba(28,26,25,.38) }
.cal-scroll::-webkit-scrollbar-track{ background:transparent }
/* mesecni pogled: brez drsnika, fiksna visina po vsebini */
/* ce je overflow-x:auto, brskalnik navpicni "visible" obravnava kot "auto" in drsnik ostane,
   zato mesecni pogled v celoti izklopi prelivanje */
.cal-scroll.brez-drsnika{ overflow:visible; height:auto; max-height:none }
@media(max-width:820px){ .cal-scroll{ height:calc(100dvh - 185px) } }

/* ══ Berljivost in enotnost admina (v55, 2026-11-05) ══════════════════════════
   Sistem: najmanjse besedilo 11–12px, oznake in ure temnejse, temnejsa koralna za povezave
   in glavni gumb; na telefonu polja 16px (iPhone ne poveca strani) in gumbi vsaj 40px.
   Bloki terminov (.ev, .ev-t, .ev-n, .ev-s) NAMENOMA NISO spremenjeni – merilo casovnice
   (v51: 92/86 px na uro) je izracunano tocno na njihovo velikost pisave. */
:root{ --coral-txt:#8a6a3b; --coral-gumb:#b08d57; }
.mini-dow{ font-size:.7rem; opacity:.75 }
.dayhead .dow{ font-size:.72rem; opacity:.8 }
.dayhead.today .dnum{ color:var(--coral-txt) }
.gutter .hr{ font-size:.74rem; opacity:.85 }
.badge{ font-size:.72rem }
.badge.podogovoru{ color:var(--coral-txt) }
header .who{ opacity:.8 }
header .brand .brand-tag{ opacity:.75 }
header .brand .brand-tag[style]{ opacity:.55 !important }   /* oznaka razlicice mora biti berljiva */
.pop-wide label, .nb-svc-label{ opacity:.85 }
.pop .d-edit-row label{ opacity:.85 }
.d-head-sub{ color:#5f6f79 }
.pop .d-meta a{ color:#963f3f; font-weight:500 }
.d-edit-hd, .pop .d-edit-hd{ color:var(--coral-txt) }
.btn-main{ background:var(--coral-gumb) }
.obr-open{ background:var(--coral-gumb)!important }
.cust-head .cust-meta{ opacity:.82 }
.cust-head .cust-sub{ opacity:.85 }
.uvoz-tag{ color:#5a4936 }
.vir-hd span{ opacity:.75 }
@media (max-width:820px), (pointer:coarse){
  input:not([type=checkbox]):not([type=radio]), select, textarea{ font-size:16px }
  .act, .btn-ghost{ min-height:40px; font-size:.8rem }
  .nav-btn{ width:40px; height:40px }
  .seg button{ min-height:40px }
  .mini-day{ height:2.35rem; font-size:.85rem }
  .mini-nav{ min-width:40px; min-height:40px }
  #detail .pop .x, .pop .x{ min-width:40px; min-height:40px }
  .pop .x::after{ content:''; position:absolute; inset:-4px }
}

.btn-ghost, .act, .zap-filter{ border:1px solid var(--sb-line); background:#fff; font-weight:500; }

.act.save{ background:var(--sb-ink); border-color:var(--sb-ink); color:#fff; }

.toolbar{ padding:1.1rem 1.5rem .5rem; }
.range{ font-family:var(--sb-serif); font-weight:500; letter-spacing:-.02em; font-size:1.4rem; }

.card, .mini-cal, .cal, .cust, .bl-glavni, .bl-mesec, .obr-box, .obr-form, .ui-card, .block-form, .stranke .search{ border-color:var(--sb-line); }
